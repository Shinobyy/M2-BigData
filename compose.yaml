services:
  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline:
    build: ./scripts
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - ./scripts/.env
    environment:
      # Ces valeurs écrasent celles de .env (prévues pour une exécution sur
      # l'hôte) : dans le réseau compose, ClickHouse s'appelle "clickhouse".
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      SOURCE_PATH: /data/source
      LAKE_PATH: /data/lake
      STATE_PATH: /data/state
      LOOP_INTERVAL: 60
    volumes:
      # Dépôt du CHU monté en lecture seule : la contrainte du sujet est
      # garantie par l'infrastructure, pas seulement par le code.
      - ./source-filestorage:/data/source:ro
      - ./lake:/data/lake
      # État d'orchestration (watermarks), monté en dossier et non en fichier :
      # un montage de fichier seul casserait si le log était réécrit par renommage.
      - ./state:/data/state
    restart: unless-stopped

  metabase:
    image: metabase/metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: mydb
      MB_DB_PORT: 5432
      MB_DB_USER: user
      MB_DB_PASS: password
      MB_DB_HOST: postgres
    depends_on:
      - postgres
    volumes:
      - ./drivers:/plugins

    
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  clickhouse_data: